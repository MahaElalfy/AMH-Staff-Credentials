<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMH Credentials Portal</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@500;600;700&display=swap">
<style>
/* Layout: white logo bar, brand-green tab strip, one working column (staff) or a wide data column (admin). Colors from the AlMather Hospital brand system. */
:root{
  color-scheme:light;
  --bg:#F4F9F6; --surface:#FFFFFF; --tint:#E7F0EB; --line:#CFE0D6; --ink:#0F1E17; --muted:#4D5E55;
  --palm:#003825; --on-brand:#F4F9F6; --on-brand-dim:#B5D3C3; --vivid:#00C576;
  --accent:#016B43; --accent-ink:#F4F9F6; --accent-soft:#D5E6DD;
  --ok-bg:#D9F2E5; --ok-fg:#0B5A38; --warn-bg:#FCE9D2; --warn-fg:#8A4700;
  --bad-bg:#F8DDE0; --bad-fg:#A11C29; --pend-bg:#E6E8F1; --pend-fg:#454B66;
  --paper:#FFFFFF; --paper-ink:#0F1E17; --paper-muted:#4D5E55; --paper-line:#CFE0D6;
  --shadow:0 12px 32px -8px rgba(15,30,23,.28); --scrim:rgba(15,30,23,.45);
  --f-ui:"Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head:"Noto Serif", Georgia, "Times New Roman", serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0C1611; --surface:#13211A; --tint:#1A2C23; --line:#29423A; --ink:#E5EFE9; --muted:#9DB2A6;
  --palm:#00281A; --on-brand-dim:#9CC2AE; --accent:#00C576; --accent-ink:#0F1E17; --accent-soft:#1D3A2D;
  --ok-bg:#123B29; --ok-fg:#7BE0B0; --warn-bg:#3D2A10; --warn-fg:#F5B565;
  --bad-bg:#3E1A1E; --bad-fg:#F49AA2; --pend-bg:#262A3B; --pend-fg:#BCC1DC;
  --shadow:0 12px 32px -8px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-head); font-weight:600; text-wrap:balance; margin:0; line-height:1.25}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
:focus-visible{outline:none; box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--vivid); border-radius:var(--r-sm)}

/* the logo is drawn for a white ground, so its bar stays white in both themes */
.band{background:var(--paper); color:var(--paper-ink)}
.band-in{display:flex; align-items:center; gap:12px 24px; flex-wrap:wrap; padding-block:10px}
.brand{display:flex; align-items:center; gap:16px; min-width:0}
.logo{display:block; height:56px; width:auto; max-width:100%}
.b-sub{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--paper-muted); font-weight:600; padding-left:16px; border-left:1px solid var(--paper-line)}
.who{margin-left:auto; display:flex; align-items:center; gap:12px; min-width:0}
.who .w-name{font-weight:600; font-size:13px}
.who .w-role{font-size:11px; color:var(--paper-muted)}
.who .btn{background:var(--paper); color:var(--paper-ink); border-color:var(--paper-line)}
@media (max-width:560px){ .logo{height:40px} .b-sub{display:none} }
.tabs-row{background:var(--palm)}
.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; color:var(--on-brand-dim); font:inherit; font-weight:600; font-size:13px; padding:10px 14px 12px; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; display:flex; gap:8px; align-items:center}
.tab:hover{color:var(--on-brand)}
.tab[aria-selected="true"]{color:var(--on-brand); border-bottom-color:var(--vivid)}
.tab .cnt{background:var(--vivid); color:#0F1E17; border-radius:999px; font-size:11px; padding:0 7px; line-height:18px}
.tabs-row .stripe{height:6px}

main{padding-block:28px 64px; display:flex; flex-direction:column; gap:24px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.page-head p{margin-top:4px; max-width:65ch}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.btn{appearance:none; font:inherit; font-weight:600; font-size:13px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none; border-color:transparent; color:var(--accent)}
.btn.ghost:hover{background:var(--tint)}
.btn.danger{color:var(--bad-fg)}
.btn.danger.armed{background:var(--bad-fg); border-color:var(--bad-fg); color:var(--surface)}
.btn.sm{padding:5px 10px; font-size:12px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.icon-btn{appearance:none; border:0; background:none; color:var(--muted); font-size:22px; line-height:1; width:36px; height:36px; border-radius:50%; cursor:pointer}
.icon-btn:hover{background:var(--tint); color:var(--ink)}

.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap; line-height:1.4}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none}
.ok{background:var(--ok-bg); color:var(--ok-fg)}
.warn{background:var(--warn-bg); color:var(--warn-fg)}
.bad{background:var(--bad-bg); color:var(--bad-fg)}
.pend{background:var(--pend-bg); color:var(--pend-fg)}
.neutral{background:var(--tint); color:var(--muted)}
.mini{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:var(--r-sm); margin:2px 4px 2px 0}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.panel-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:16px 20px; border-bottom:1px solid var(--line)}
.panel-body{padding:16px 20px}
.empty{padding:36px 20px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center}
.empty p{max-width:52ch}

.signin{max-width:440px; margin:24px auto 0; padding:28px; display:flex; flex-direction:column; gap:16px}
.signin .steps{font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; padding-left:18px; margin:0}

.profile{display:flex; gap:16px 28px; flex-wrap:wrap; align-items:center; padding:18px 20px}
.profile .pf{display:flex; flex-direction:column; min-width:0}
.pf-l{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}
.pf-v{font-weight:600}
.profile .btn{margin-left:auto}

.progress{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.bar{flex:1; min-width:160px; height:8px; background:var(--tint); border-radius:999px; overflow:hidden; display:flex}
.bar span{display:block; height:100%}
.bar .f-ok{background:var(--ok-fg)} .bar .f-warn{background:var(--warn-fg)} .bar .f-pend{background:var(--pend-fg)}

.list{display:flex; flex-direction:column}
.cred{display:grid; grid-template-columns:62px minmax(0,1fr) auto auto; gap:6px 16px; align-items:center; padding:14px 20px; border-top:1px solid var(--line)}
.list > .cred:first-child{border-top:0}
.code{display:grid; place-items:center; height:44px; border-radius:var(--r-md); background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.04em; text-align:center; padding:0 4px; line-height:1.1}
.cred-name{font-weight:600}
.cred-meta{font-size:12px; color:var(--muted)}
.cred-note{grid-column:2 / -1; font-size:12px; background:var(--bad-bg); color:var(--bad-fg); padding:6px 10px; border-radius:var(--r-sm)}
.cred .acts{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap}
@media (max-width:640px){
  .cred{grid-template-columns:48px minmax(0,1fr)}
  .cred > .chip{grid-column:2; justify-self:start}
  .cred .acts{grid-column:2; justify-content:flex-start}
  .code{height:40px; font-size:11px}
}

.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px; display:flex; flex-direction:column; gap:2px; text-align:left; font:inherit; color:inherit; cursor:pointer}
.tile:hover{border-color:var(--muted)}
.tile .t-l{font-size:12px; color:var(--muted); font-weight:600}
.tile .t-v{font-family:var(--f-head); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.tile .t-s{font-size:12px; color:var(--muted)}
.tile.is-bad .t-v{color:var(--bad-fg)} .tile.is-warn .t-v{color:var(--warn-fg)} .tile.is-ok .t-v{color:var(--ok-fg)} .tile.is-pend .t-v{color:var(--pend-fg)}

.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line)}
.filters .grow{flex:1; min-width:180px}
.filters select{width:auto; max-width:100%}

label.f, div.f{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--muted); min-width:0}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=tel],input[type=email],select,textarea{font:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px; width:100%; min-width:0}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.req::after{content:" *"; color:var(--bad-fg)}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px}
.grid2 .full{grid-column:1 / -1}
@media (max-width:560px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.hint{font-size:12px; color:var(--muted); font-weight:400}
.err{color:var(--bad-fg); font-size:13px}
.drop{border:1.5px dashed var(--line); border-radius:var(--r-md); padding:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--tint)}
.drop input{font-size:13px; max-width:100%}
.check{display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink); font-weight:400}
.check input{margin-top:3px; accent-color:var(--accent)}
.checks{display:flex; flex-wrap:wrap; gap:6px 14px}

.tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--tint)}
td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--tint)}
tbody tr:last-child td{border-bottom:0}
td .sub{font-size:12px; color:var(--muted)}
.mx td,.mx th{white-space:nowrap}

#modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.scrim{position:absolute; inset:0; background:var(--scrim)}
.modal{position:relative; background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow); width:min(620px, 100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden}
.modal.wide{width:min(940px, 100%)}
.m-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:18px 20px 14px; border-bottom:1px solid var(--line)}
.m-head p{font-size:13px; margin-top:2px}
.m-body{padding:18px 20px; overflow:auto; display:flex; flex-direction:column; gap:16px; min-height:0}
.m-foot{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); background:var(--tint)}
.viewer{display:flex; flex-direction:column; gap:12px; align-items:center}
.viewer img,.viewer canvas{max-width:100%; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--paper)}
.sig{width:100%; height:160px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-md); touch-action:none; cursor:crosshair}

.req-sec .panel-body{display:flex; flex-direction:column; gap:12px}
.edit-row{display:grid; grid-template-columns:110px minmax(0,1fr) 120px 130px 40px; gap:10px; align-items:center}
@media (max-width:760px){ .edit-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .edit-row .wide2{grid-column:1 / -1} .edit-head{display:none} }
.edit-head{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tagset{display:flex; flex-wrap:wrap; gap:6px}
.tag{display:inline-flex; align-items:center; gap:4px; background:var(--tint); border:1px solid var(--line); border-radius:999px; padding:3px 4px 3px 12px; font-size:13px}
.tag button{appearance:none; border:0; background:none; color:var(--muted); cursor:pointer; width:22px; height:22px; border-radius:50%; font-size:15px; line-height:1}
.tag button:hover{background:var(--bad-bg); color:var(--bad-fg)}
.rule{border:1px solid var(--line); border-radius:var(--r-md); padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--bg)}
.rule-top{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.rule-top select{width:auto; max-width:100%}
.lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.savebar{position:sticky; bottom:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.savebar .grow{flex:1}

#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:calc(100% - 32px)}
.toast{background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--r-md); font-weight:600; font-size:13px; box-shadow:var(--shadow)}
.toast.bad{background:var(--bad-fg); color:var(--surface)}
.notice{padding:12px 16px; border-radius:var(--r-md); background:var(--tint); border:1px solid var(--line); font-size:13px}
@media (prefers-reduced-motion: no-preference){ .toast{animation:up .2s ease-out} @keyframes up{from{transform:translateY(8px); opacity:0}} }
</style>
</head>
<body>
<header class="band">
  <div class="wrap band-in">
    <div class="brand">
      <img class="logo" src="logo.png" alt="AlMather Hospital, a subsidiary of King Faisal Specialist Hospital &amp; Research Centre" width="1832" height="658">
      <div class="b-sub">Staff Credentials Portal</div>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div class="tabs-row"><div class="wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav></div><div class="stripe" id="stripe"></div></div>
</header>
<main class="wrap" id="main"><div class="panel empty"><h2>Loading the credentials portal…</h2></div></main>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
const CFG = window.AMH_CONFIG || {};
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k of kids.flat(Infinity)) { if (k == null || k === false) continue; el.append(k instanceof Node ? k : String(k)); }
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "disabled" || k === "selected" || k === "hidden") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  return el;
}
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/-/g, "").slice(0, 16);
const pad = n => String(n).padStart(2, "0");
const toIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => toIso(new Date());
const parseIso = s => new Date(s.slice(0, 10) + "T00:00:00");
function addMonths(iso, m) { const d = parseIso(iso); const day = d.getDate(); d.setMonth(d.getMonth() + m); if (d.getDate() < day) d.setDate(0); return toIso(d); }
const daysUntil = iso => Math.round((parseIso(iso) - parseIso(todayIso())) / 86400000);
const fmtDate = iso => iso ? parseIso(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const fmtTs = ts => ts ? new Date(ts).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg, tone) { const t = h("div", { class: "toast" + (tone ? " " + tone : "") }, msg); $("#toast").append(t); setTimeout(() => t.remove(), 4000); }
async function busy(btn, fn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Working…";
  try { return await fn(); }
  catch (e) { console.error(e); toast(errText(e), "bad"); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
}
function errText(e) {
  const m = (e && (e.message || e.error_description)) || "";
  if (e && e.code === "23505") return "This employee ID is already registered to another account. Contact the credentials office.";
  if (/row-level security|violates|permission/i.test(m)) return "That change was refused. You may not have permission for it.";
  if (/rate limit/i.test(m)) return "Too many attempts. Wait a few minutes and try again.";
  if (/exceeded the maximum allowed size|Payload too large/i.test(m)) return "That file is too large.";
  if (/mime type/i.test(m)) return "That file type isn't accepted. Use PDF, JPG or PNG.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Can't reach the server. Check your connection and try again.";
  return m || "Something went wrong. Try again.";
}
function must(res) { if (res.error) throw res.error; return res.data; }
/* two-step confirm for destructive buttons */
function armed(btn, label, fn) {
  let t; btn.addEventListener("click", () => {
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.dataset.l = btn.textContent; btn.textContent = label; t = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = btn.dataset.l; }, 4000); return; }
    clearTimeout(t); btn.classList.remove("armed"); btn.textContent = btn.dataset.l; fn();
  });
  return btn;
}

/* ---------- state ---------- */
const S = {
  ready: false, uid: null, email: "", isAdmin: false,
  matrix: null, jds: [], mine: null, staff: [], tab: "mine", built: null,
  f: { dept: "", status: "", q: "" }, draft: null, dirty: false
};
let sb = null;
const WARN_DAYS = 60;
const MAX_PDF = 5 * 1024 * 1024;
const TONE = { missing: "bad", expired: "bad", rejected: "bad", pending: "pend", expiring: "warn", valid: "ok" };
const SCFHS_CLASSES = ["Consultant", "Senior Registrar / Senior Specialist", "Registrar / Specialist", "Resident", "General Practitioner", "Senior Specialist Nurse", "Specialist Nurse", "Nurse Technician", "Other"];
const credExtra = item => item ? [item.classification, item.specialty].filter(Boolean).join(", ") : "";

/* ---------- requirement logic ---------- */
const M = () => S.matrix || { credentials: [], departments: [], positions: [], rules: [] };
const deptName = id => id === "*" ? "All departments" : (M().departments.find(d => d.id === id) || {}).name || "Unknown department";
function requiredFor(p, m = M()) {
  if (!p) return [];
  const ids = new Set();
  for (const r of m.rules || []) {
    if ((r.dept === "*" || r.dept === p.dept) && (!r.positions || !r.positions.length || r.positions.includes(p.position))) (r.creds || []).forEach(c => ids.add(c));
  }
  return (m.credentials || []).filter(c => ids.has(c.id));
}
const jdsFor = p => p ? S.jds.filter(j => !j.archived && (j.dept === "*" || j.dept === p.dept) && (!j.positions || !j.positions.length || j.positions.includes(p.position))) : [];
function evalCred(c, item) {
  if (!item) return { k: "missing", label: "Not submitted" };
  const exp = item.expiryDate || null, d = exp ? daysUntil(exp) : null;
  if (exp && d < 0) return { k: "expired", label: "Expired", exp, d };

async function startSession(session) {
  S.uid = session.user.id; S.email = (session.user.email || "").toLowerCase();

  S.isAdmin = adm.data === true;
  const h0 = (location.hash || "").slice(1);
  S.tab = S.isAdmin ? (["mine", "compliance", "review", "jds", "requirements"].includes(h0) ? h0 : "compliance") : "mine";

(function boot() {
